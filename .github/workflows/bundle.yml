name: bundle

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"

permissions:
  contents: write

env:
  ABI: arm64-v8a
  ARMSX2_PIN: a0bdcbe917bea686333c9683c28b2fca8ed1ed8d
  DOLPHIN_PIN: b008142f72a099a9bcb971776209504f085ae0be

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd

      - name: Check for new core releases
        id: sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > sources.txt
          while IFS='|' read -r repo asset; do
            [ -z "$repo" ] && continue
            case "$repo" in \#*) continue ;; esac
            gh api "repos/WinNative-Emu/$repo/releases/tags/latest" \
              --jq ".assets[] | select(.name==\"$asset\") | \"$repo|\(.name)|\(.updated_at)|\(.size)\"" >> sources.txt
          done < cores.list
          sort -o sources.txt sources.txt
          fp=$(sha256sum sources.txt | cut -d' ' -f1)
          prev=$(curl -sfL "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/sources.sha256" | tr -d '[:space:]' || true)
          cat sources.txt
          echo "fingerprint $fp"
          echo "previous    ${prev:-<none>}"
          echo "$fp" > sources.sha256
          if [ "$fp" = "$prev" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "No core has published a new build; skipping the rebuild."
          else
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect cores
        if: steps.sources.outputs.fresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p stage/cores
          while IFS='|' read -r repo asset; do
            [ -z "$repo" ] && continue
            case "$repo" in \#*) continue ;; esac
            gh release download latest --repo "WinNative-Emu/$repo" --pattern "$asset" --dir stage/cores --clobber
            echo "  $repo -> $asset"
          done < cores.list
          ls -l stage/cores

      - name: Collect emulator data
        if: steps.sources.outputs.fresh == 'true'
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/WinNative-Emu/dolphin.git dolphin-src
          git -C dolphin-src checkout -q "$DOLPHIN_PIN" -- Data/Sys
          mkdir -p stage/data/dolphin-emu
          cp -r dolphin-src/Data/Sys stage/data/dolphin-emu/

          git clone -q --filter=blob:none --no-checkout https://github.com/WinNative-Emu/ARMSX2.git armsx2-src
          git -C armsx2-src checkout -q "$ARMSX2_PIN" -- platforms/android/app/src/main/assets
          mkdir -p stage/data/armsx2
          cp -r armsx2-src/platforms/android/app/src/main/assets/. stage/data/armsx2/ 2>/dev/null || true
          du -sh stage/data/* || true

      - name: Pack
        if: steps.sources.outputs.fresh == 'true'
        id: pack
        run: |
          # zstd -T0 picks its worker count from the host, and multi-worker
          # framing is not byte-stable; -T1 keeps the archive reproducible.
          # The tar hash is logged separately so a future drift can be pinned
          # on the archive rather than the compressor.
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
              --mode=go-w,go+rX --format=gnu -C stage -cf raw.tar .
          echo "tar    $(sha256sum raw.tar | cut -d' ' -f1)"
          zstd -19 -T1 -q -o retro-consoles.tzst raw.tar
          rm -f raw.tar
          sha256sum retro-consoles.tzst | cut -d' ' -f1 > retro-consoles.tzst.sha256
          sha=$(cat retro-consoles.tzst.sha256)
          published=$(curl -sfL "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/retro-consoles.tzst.sha256" | tr -d '[:space:]' || true)
          ls -l retro-consoles.tzst
          echo "built     $sha"
          echo "published ${published:-<none>}"
          if [ "$sha" = "$published" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Bundle is byte-identical to the published one; nothing to release."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          tag="bundle-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          cat > bundle-info.json <<EOF
          {
            "tag": "$tag",
            "buildDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "sha256": "$sha",
            "size": $(stat -c%s retro-consoles.tzst),
            "cores": $(ls stage/cores | wc -l)
          }
          EOF
          cat bundle-info.json
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.sources.outputs.fresh == 'true' && steps.pack.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.pack.outputs.tag }}"
          notes="Combined arm64-v8a retro console bundle: every libretro core, the ARMSX2 and Dolphin emucores, and their runtime data."
          for t in "$tag" latest; do
            if ! gh release view "$t" > /dev/null 2>&1; then
              gh release create "$t" --title "$t" --notes "$notes"
            fi
            gh release upload "$t" retro-consoles.tzst retro-consoles.tzst.sha256 bundle-info.json sources.sha256 --clobber
          done
          gh release edit latest --notes "$notes"$'\n\n'"Newest immutable tag: $tag"
